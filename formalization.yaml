  methods:
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        The preprint (21 and 22 November 2026): Claude Opus 5.5 agents in Claude Code
        (Anthropic) scanned the open entries of the catalogue, searched for counterexamples,
        found the family F_q and its proof, wrote the programs, the Lean supplement and the
        text, under the direction of Jiří Chmel. The graph generator of one search program
        comes from a library written in the same project on 19 November 2026 by Claude
        Fable 5.2, another Anthropic model. Further Claude agents, writing programs of their
        own, refereed the proof, recomputed the invariants, repeated the searches and
        audited the formal proof.
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code"
      tool_setup: >-
        This package (23 November 2026): Claude Opus 5.5 agents in Claude Code wrote the
        Formal Conjectures statement, cut the Challenge from it, copied the proof from the
        preprint's Lean supplement into a Solution that uses the module system, wrote the
        bridge lemmas and this metadata, under the direction of Jiří Chmel.
  notes: >-
    AI assistance was material throughout: the counterexample search, the proofs, the
    paper and the Lean formalization were produced by Claude Opus 5.5 agents in Claude Code
    (Anthropic). Jiří Chmel directed the work (chose the problems and the lines of work, set the working
    rules, and decided what to write up and publish), is the human author and maintainer,
    and takes responsibility for the work. No AI system is listed as an author.

fidelity:
  divergences: >-
    (1) The hypothesis that A₃ is nonempty is added: when A₃ is empty, α(G[A₃]) = 0 and the
    source's right side ⌊3/0⌋ is undefined; see status.scope. (2) Definition 90 says that a
    vertex outside a 2-dominating set D is "adjacent to 2 vertices" of D; this is read as at
    least two, the standard meaning (IsTwoDominating). (3) Definition 113 does not say whose
    degree sequence is meant; the Challenge uses the degrees of G, as the definition reads.
    With the degrees of the complement, F₃ is still a counterexample: the Solution proves
    that the same formula applied to the complement of F₃ also gives 6
    (welshPowellComplement_compl_F3). (4) The floor ⌊3/α⌋ is division of natural numbers.
    (5) α(G[A₃]) is Mathlib's independence number of the subgraph induced by A₃.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 agents in Claude Code, separate from the agents that wrote the work"
  notes: >-
    Checks so far. The Lean kernel accepts the proof (Lean v4.35.0, Mathlib v4.35.0 at commit 56a005855ea1),
    and #print axioms of the selected theorem shows only propext, Classical.choice and
    Quot.sound. One translation review by an AI agent, with programs of its own and
    negative controls, checked the translation of the catalogue's statement into the
    Challenge. Before that, the preprint's hand proof was refereed by
    Claude agents writing programs of their own, which also recomputed the invariants,
    repeated the searches and audited the preprint's formal proof. No human referee has
    reviewed the preprint or this package yet, and there has been no external peer review.

alignment:
  namespace: "WrittenOnTheWallII.GraphConjecture399b"
  statements:
    - source: >-
        Written on the Wall II, Conjecture 399b: if G is a connected graph on n > 2
        vertices, then γ₂ ≤ WP(Ḡ) + ⌊3/α(G[A₃])⌋, where A₃ is the set of vertices of degree
        at least three. The package proves that this is false.
      lean: "WrittenOnTheWallII.GraphConjecture399b.conjecture399b"
      module: "Solution"
      status: "proved"
      note: >-
        The negation of the statement, for connected graphs on more than two vertices with
        A₃ nonempty; see fidelity.divergences. The bridge lemmas in Solution.lean show that
        the Challenge's definitions agree with those of the preprint's Lean supplement.

acknowledgements: >-
  Mathlib. IsTwoDominating and twoDominationNumber come from Formal Conjectures pull
  request #7320.
