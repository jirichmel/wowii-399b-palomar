# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "WOWII Conjecture 399b is false (a 12-vertex counterexample)"
  description: >-
    Conjecture 399b of DeLaViña's Written on the Wall II (Graffiti.pc) says that every
    connected graph G on n > 2 vertices satisfies γ₂(G) ≤ WP(Ḡ) + ⌊3/α(G[A₃])⌋, where γ₂ is
    the 2-domination number, WP(Ḡ) the Welsh–Powell invariant of the complement (the
    largest k with k + d_k ≤ n, the degrees of G taken in nondecreasing order) and A₃ the
    set of vertices of degree at least three. The package proves the negation, for
    connected graphs on more than two vertices whose set A₃ is nonempty, with a connected
    graph F₃ on 12 vertices (graph6 KCOfFFb?~?[?) that has γ₂ = 7, WP(Ḡ) = 6 and
    α(G[A₃]) = 4, so that 7 > 6 = 6 + ⌊3/4⌋.
  authors:
    - "Jiří Chmel"
  responsible_maintainers:
    - "Jiří Chmel"
  license: "Apache-2.0"

classification:
  arxiv:
    - "math.CO"
  msc2020:
    - "05C69"
    - "05C07"
    - "05C15"

sources:
  - title: "A counterexample to Conjecture 399b of Written on the Wall II (preprint, version 1)"
    authors:
      - "Jiří Chmel"
    id: "https://github.com/jirichmel/wowii-399b-counterexample/tree/8b450009c511d999d33746b3b87bb50fc489b731"
    type: "paper"
    location: "The main theorem (the graphs F_q, q ≥ 3), in the case q = 3"
    relationship: "formalizes"
    author_endorsement: "participated"
    note: >-
      Preprint posted on 22 November 2026 (version 1, at the commit above). It gives the
      family F_q (q ≥ 3) with a hand proof; this package formalizes its smallest member F₃,
      which suffices to refute the conjecture. The preprint's author is the author of this
      package. The preprint itself says that it was posted before its author's own full
      review and that it has had no external peer review.
  - title: "Written on the Wall II (Conjectures of Graffiti.pc)"
    authors:
      - "Ermelinda DeLaViña"
    id: "http://cms.dt.uh.edu/faculty/delavinae/research/wowII/"
    type: "web discussion"
    location: "Conjecture 399b; definitions 90 (2-domination number) and 113 (Welsh-Powell of the complement of G)"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      States the conjecture. In the latest states of the catalogue that the preprint could
      see (an Internet Archive capture of 26 July 2026 and a copy of its rows of
      1 September 2026), the entry is marked open. The catalogue's author has not been
      contacted.

related_formalizations:
  - title: "Lean supplement of the preprint (supplement/lean, library LeanWowii)"
    authors:
      - "Jiří Chmel"
    id: "https://github.com/jirichmel/wowii-399b-counterexample/tree/8b450009c511d999d33746b3b87bb50fc489b731/supplement/lean"
    relationship: "builds-on"
    note: >-
      The Solution copies verbatim the parts of LeanWowii/W213/Defs.lean,
      LeanWowii/W213/Audit.lean, LeanWowii/W399b/Defs.lean and
      LeanWowii/W399b/Counterexample.lean that the proof uses, with every name moved under
      the prefix Palomar399b, because those files do not use Lean's module system. The
      supplement was built with a later Lean release candidate and Mathlib commit; the
      copied parts build unchanged on this package's Lean v4.35.0 and Mathlib v4.35.0. Bridge lemmas in the
      Solution prove that the Challenge's definitions agree with the supplement's.
  - title: "google-deepmind/formal-conjectures pull request #7320 (WOWII Conjecture 396)"
    id: "https://github.com/google-deepmind/formal-conjectures/pull/7320"
    relationship: "builds-on"
    note: >-
      The Challenge copies IsTwoDominating and twoDominationNumber verbatim from this open
      pull request, at its head commit adb67e65958b.

status:
  scope: >-
    The selected theorem is WrittenOnTheWallII.GraphConjecture399b.conjecture399b, the
    negation of Conjecture 399b for connected graphs on more than two vertices whose set A₃
    is nonempty. With A₃ empty the source's right side 3/0 is undefined; the extra
    hypothesis only weakens the conjecture, so its negation is the stronger claim. The
    Solution proves it with F₃ alone. The Challenge's definitions and statement are those
    of a Formal Conjectures file (FormalConjectures/WrittenOnTheWallII/GraphConjecture399b.lean)
    written for a later pull request to google-deepmind/formal-conjectures, less its
    attributes and sanity checks; that file is not public yet. The family F_q of the
    preprint and its computer searches are not formalized in this package.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "WrittenOnTheWallII.GraphConjecture399b.conjecture399b"
      file: "Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "comparator.json"

